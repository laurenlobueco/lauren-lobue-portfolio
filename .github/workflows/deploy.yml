name: Deploy via SSH
'on':
  # Only deploy the live site from main, not from feature branches
  push:
    branches: [main]
  repository_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      # Make sure the @v0.9.0 matches the current version of the action
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PRIVATE_KEY }}

      - name: Install dependencies
        run: npm install

      - name: Build Vite site
        run: npm run build

      - name: Deploy to server
        run: |
          ssh-keyscan -H laurenlobue.marketing >> ~/.ssh/known_hosts 
          scp -r ./dist/* lo@laurenlobue.marketing:/var/www/laurenlobue.marketing/html